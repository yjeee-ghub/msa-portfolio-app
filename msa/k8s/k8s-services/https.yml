apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: my-issuer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: yoonjoung429@gmail.com
    privateKeySecretRef:
      name: my-issuer
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: server-aws-yjeee-com-tls
  namespace: soldesk
spec:
  secretName: server-aws-yjeee-com-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: my-issuer
    kind: ClusterIssuer
  commonName: server.aws-yjeee.com
  dnsNames:
    - server.aws-yjeee.com