apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-depl
  namespace: soldesk
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
      labels:
        app: product
    spec:
      serviceAccountName: product-sa
      containers:
        - name: product-container
          image: 193644343848.dkr.ecr.ap-northeast-2.amazonaws.com/product-service@sha256:28650bc038552a938d47c7edfe96054fdb80a6798abddf90f0acf6f7aaf4e75d
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: "500Mi"
            requests:
              cpu: "0.5"
              memory: "250Mi"
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: my-app-secrets
                  key: DB_HOST
            - name: DB_PW
              valueFrom:
                secretKeyRef:
                  name: my-app-secrets
                  key: DB_PW
            - name: CLOUD_AWS_S3_BUCKET
              value: "soldesk-product-shop-images-193644343848"

           
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: soldesk
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: product


---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-sa
  namespace: soldesk
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::193644343848:role/msa-product-s3-role
---   